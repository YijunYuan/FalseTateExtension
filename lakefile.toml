name = "FalseTateExtension"
version = "0.1.0"
requiresModuleSystem = true
defaultTargets = ["FalseTateExtension"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "1e75e9dd53d483fa01eff9ac7d4ea0472ce9d1fa"

[[require]]
name = "FontaineWintenberger"
git = "https://github.com/YijunYuan/FontaineWintenberger"
rev = "9d1b347c56de186b3b0984303ceb901fd697ba11"

[[lean_lib]]
name = "FalseTateExtension"
